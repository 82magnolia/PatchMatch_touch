model:
  params:
    # Fine-tune the released model; it already embeds the KL first-stage weights.
    ckpt_path: pretrained_models/img2touch.ckpt
    first_stage_config:
      params:
        ckpt_path: null

data:
  params:
    # One sample uses about 19.7 GiB on an RTX 3090 with this 422M model.
    batch_size: 1
    num_workers: 4
    train:
      target: ldm.patchmatch_sim_data.PatchMatchSimDataset
      params:
        manifest_path: ../../../log/baselines/tarf_training/patchmatch_sim/manifest.json
        split: train
        background_path: touch_bg/gelsight_pseudo_background.jpg
        size: 256
    validation:
      target: ldm.patchmatch_sim_data.PatchMatchSimDataset
      params:
        manifest_path: ../../../log/baselines/tarf_training/patchmatch_sim/manifest.json
        split: val
        background_path: touch_bg/gelsight_pseudo_background.jpg
        size: 256
    test:
      target: ldm.patchmatch_sim_data.PatchMatchSimDataset
      params:
        manifest_path: ../../../log/baselines/tarf_training/patchmatch_sim/manifest.json
        split: test
        background_path: touch_bg/gelsight_pseudo_background.jpg
        size: 256

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 200
        max_images: 1
        increase_log_steps: false
        max_validation_image_batches: 1
  logger:
    target: pytorch_lightning.loggers.CSVLogger
    params:
      name: csv
  trainer:
    max_epochs: 30
